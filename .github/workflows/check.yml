name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SVGs are well-formed and every README image exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          import xml.etree.ElementTree as ET

          bad = []
          for svg in sorted(pathlib.Path("assets").glob("*.svg")):
              try:
                  ET.parse(svg)
              except ET.ParseError as e:
                  bad.append(f"{svg}: {e}")

          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          for ref in re.findall(r'(?:src|srcset)="([^"]+)"', readme):
              if not ref.startswith("http") and not pathlib.Path(ref).exists():
                  bad.append(f"README points at a missing file: {ref}")

          print("\n".join(bad) or "all SVGs parse, all README images exist")
          sys.exit(1 if bad else 0)
          PY
